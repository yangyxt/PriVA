# config.yaml
# First install: create cache_root and tmp_dir directories on this host, then set their absolute paths,
# then select assembly and the requested VEP major. No workflow inputs are needed yet.
# Empty managed resource keys below are filled by main_install. Explicit input identities are
# preserved; external caches are adopted beneath cache_root before managed paths are saved.

####################################################Prepare these paths before running the install_utils.sh script####################################################
tmp_dir: ""
assembly: hg19   # Change this you need to re-run the install_utils.sh script
ref_genome: ""  # Optional existing indexed assembly-correct FASTA; empty uses managed UCSC acquisition.
conda_env_yaml: "acmg_conda_rough.yml"  # main_install uses this bundled environment definition.
conda_env_name: "priva_acmg"   # main_install prepares the fixed priva_acmg environment.
hg38_hg19_chain: "hg38ToHg19.over.chain.gz"   # Included in the GitHub repo, not recommend to change

# Required data/cache storage root, also used for generated HPO/mechanism resources.
cache_root: ""

# Optional: omit this mapping, or individual entries, to use these defaults.
# Values are single folder names directly beneath cache_root.
cache_folders:
  vep_cache: VEP_cache
  vep_plugin: VEP_plugin
  vep_plugin_cache: VEP_plugin_cache
  gnomad: gnomAD
  clinvar: ClinVar
  cadd: CADD

# Resolved directory paths: maintained by install_utils.sh; do not edit these
# when cache_root is set. Saved resource paths beneath them follow root/name changes.
gnomad_vcf_dir: ""  # The directory to store the gnomAD related annotation resources
clinvar_vcf_dir: ""  # The directory to store the ClinVar related annotation resources
vep_installed_version: "116"  # Requested VEP major release; software/plugins/cache must match.
vep_cache_dir: ""  # the cache directory for VEP
vep_plugins_dir: ""  # the directory containing the VEP plugins executable files
vep_plugins_cachedir: ""   # the directory for storing the VEP plugin caches
cadd_parent_dir: ""  # The parent directory to store the CADD scripts and cache files
####################################################Ready to RUN install_utils.sh script####################################################


####################################################Prepare these paths before running PriVA workflow####################################################
# input_vcf and output_dir are required for a workflow run, not for installation.
# Select cohort/PED/hub paths here before running; optional cohort inputs may stay empty.
input_vcf: ""  # Below we specify the input vcf file in absolute paths
ped_file: ""  # The PED file containing the identical sample set included in the input VCF file
output_dir: ""  # Output directory in absolute paths, per-family outputs will be stored directly in it

hub_file_dir: ""   # the directory for storing the hub files for annotation caching
hub_vcf_file: "hg19.anno.vcf.gz"    # hub file name for annotation caching
hub_cadd_file: "hg19.cadd.tsv.gz"    # hub file name for CADD annotation caching

extreme_rare_PAF: 0.0001
exp_disease_incidence: 0.0001
threads: 20          # Total threads for annotation / non-family steps
threads_per_fam: 4   # Threads for EACH family filtering/prioritization job
af_cutoff: 0.05      # Allele frequency cutoff for common variants

alt_disease_vcf: ""  # abs path to the VCF file containing the variants from alternative disease patients, make sure it is left-normalized and biallelic, optional
control_vcf: ""   # VCF file containing the variants from control individuals, make sure it is left-normalized and biallelic, optional
pp1_vcf: ""      # Cohort VCF file containing patients and their family members for PP1 (cosegregation), optional
pp1_ped: ""      # PED file for the PP1 cohort VCF file, optional
####################################################You can adjust above argument values for each cohort####################################################


####################################################Below paths will be determined automatically by install_utils.sh####################################################
# Below we specify the path to the gnomAD vcf file for chromosome X and we'll use that template to deduce the paths to other chromosome VCF files, the paths should be relatively constant
gnomad_vcf_chrX: ""

