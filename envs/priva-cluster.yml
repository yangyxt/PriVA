# Cluster deployment of PriVA's Python reference implementation.
# Scientific versions below come from acmg_conda.yml at 09223ef. Additional
# cache-builder dependencies were absent from that export; resolve once and
# retain environment.explicit.txt before accepting results. CADD has its own
# upstream environments and is intentionally not installed into Python 3.12.
name: priva_acmg
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.3
  - ensembl-vep=113.2
  - snakemake=8.25.2
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.14.1
  - scikit-learn=1.5.2
  - statsmodels=0.14.4
  - matplotlib=3.9.1
  - polars=1.27.1
  - pysam=0.22.1
  - pybedtools=0.10.0
  - pyfaidx=0.8.1.3
  - pyarrow
  - diptest
  - requests
  - pyyaml
  - jsonschema=4.23.0
  - openpyxl
  - gffutils=0.13
  - bcftools=1.21
  - samtools=1.21
  - bedtools=2.31.1
  - htslib=1.21
  - crossmap=0.7.0
  - tsv-utils
  - sambamba
  - seqtk
  - parallel
  - mawk
  - gengetopt
  - perl-bio-procedural
  - perl-bioperl
  - perl-bio-bigfile
  - perl-dbd-sqlite
  - perl-compress-raw-zlib>=2.201
  - yq=3.4.3
  - git
  - git-lfs
  - wget
  - curl
  - unzip
  - ca-certificates
  - openssl
