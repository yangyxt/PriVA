name: priva_acmg
channels:
  - conda-forge
  - bioconda
  - r
  - defaults
dependencies:
  - anaconda::git-lfs
  - bcftools
  - bioconda::cadd-scripts
  - bioconda::crossmap
  - bioconda::tsv-utils
  - ca-certificates
  - certifi
  # Upstream CADD's Snakemake requires genuine Conda, including under Micromamba.
  - conda>=24.7.1
  - conda-forge::parallel
  - conda-forge::perl-compress-raw-zlib[version='>=2.201']
  - ensembl-vep
  # Static mature XML backend for the native InterPro mapping builder.
  - conda-forge::expat>=2.6.0
  - conda-forge::pkg-config
  - gengetopt
  - gffutils
  - mawk
  - openssl
  - perl-bio-procedural
  - pybedtools
  - pysam
  - python=3.12
  - sambamba
  - samtools
  - yq
  - snakemake=8.25.2
  - perl-bio-bigfile
  - bash
  - matplotlib
  - scipy
  - statsmodels
  - bioconda::perl-dbd-sqlite
  - anaconda::scikit-learn
  - seqtk
  - polars
  # Imported unconditionally by the domain/statistics and annotation readers.
  - diptest
  - pyarrow
