[package]
name = "priva-tabular"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Opt-in, parity-gated PriVA tabular modules"
autobins = false

[[bin]]
name = "priva"
path = "src/main.rs"

[[bin]]
name = "priva-tabular"
path = "src/bin/priva-tabular.rs"

[dependencies]
csv = "=1.3.1"
polars-core = { version = "=0.51.0", default-features = false, features = ["algorithm_group_by"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
codegen-units = 16
lto = false
